    <meta property="og:title" content="مستكشف | Mustakshif" />
    <meta property="og:description" content="موسوعة الأساطير والكائنات والرموز الفولكلورية العربية بتصميم عربي حديث وقارئ هادئ للطلاب والعائلات." />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Google Fonts: Cairo, Tajawal, Aref Ruqaa, Amiri, Reem Kufi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;500;600;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-theme-surface text-theme-text-primary antialiased selection:bg-[#7FD1AE]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>

    <!-- Error Logging: saves last 20 errors in localStorage under "app_errors" (الرسالة، الوقت، الصفحة) -->
    <script>
      (function () {
        var STORAGE_KEY = 'app_errors';
        var MAX_ERRORS = 20;

        function recordError(msg, extra) {
          try {
            var errors = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            var record = {
              message: String(msg || 'Unknown Error'),
              time: new Date().toISOString(),
              page: window.location.href,
              الرسالة: String(msg || 'Unknown Error'),
              الوقت: new Date().toISOString(),
              الصفحة: window.location.href
            };
            if (extra) record.extra = extra;
            errors.push(record);
            if (errors.length > MAX_ERRORS) {
              errors = errors.slice(errors.length - MAX_ERRORS);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(errors));
          } catch (e) {
            // Ignore storage failures
          }
        }

        window.onerror = function (msg, url, line, col, error) {
          recordError(msg, { url: url, line: line, col: col, stack: error ? error.stack : undefined });
          return false;
        };

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || 'Unhandled Promise Rejection');
          recordError(msg);
        });
      })();
    </script>

    <!-- Diagnostic Mode: Loads and initializes eruda when ?debug=1 is in URL -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.get('debug') === '1') {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/eruda';
            script.onload = function () {
              if (window.eruda) {
                window.eruda.init();
                console.log('[Mustakshif] Eruda diagnostic tools initialized');
              }
            };
            document.head.appendChild(script);
          }
        } catch (e) {
          // Ignore query param error
        }
      })();
    </script>

  </body>
</html>
