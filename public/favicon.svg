<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Subtle circular soft background for dark/light browser tab contrast -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" />
  
  <!-- Primary Square: Deep Teal #0E5C4D -->
  <rect x="22" y="22" width="56" height="56" rx="3.5" fill="none" stroke="#0E5C4D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Secondary Square: Mint Green #7FD1AE (rotated 45 degrees) -->
  <rect x="22" y="22" width="56" height="56" rx="3.5" transform="rotate(45 50 50)" fill="none" stroke="#7FD1AE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Inner geometric guide circle -->
  <circle cx="50" cy="50" r="17" fill="none" stroke="#7FD1AE" stroke-width="1.2" stroke-dasharray="2.5 2.5" stroke-opacity="0.8" />
  
  <!-- Center 4-Point Sparkle: Cool Blue #4A90D9 -->
  <path d="M 50,38 C 50,44.5 55.5,50 62,50 C 55.5,50 50,55.5 50,62 C 50,55.5 44.5,50 38,50 C 44.5,50 50,44.5 50,38 Z" fill="#4A90D9" />
  
  <!-- Micro luminous white core dot -->
  <circle cx="50" cy="50" r="1.8" fill="#FFFFFF" />
  
  <!-- 8 Cardinal/Intercardinal Accents -->
  <circle cx="50" cy="10.5" r="1.5" fill="#0E5C4D" />
  <circle cx="50" cy="89.5" r="1.5" fill="#0E5C4D" />
  <circle cx="10.5" cy="50" r="1.5" fill="#0E5C4D" />
  <circle cx="89.5" cy="50" r="1.5" fill="#0E5C4D" />
</svg>
